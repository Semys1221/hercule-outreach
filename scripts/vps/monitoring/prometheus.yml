global:
  scrape_interval: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: scraper-exporter
    static_configs:
      - targets: ["127.0.0.1:9464"]
        labels:
          service: hercule-scraper-exporter

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          service: node-exporter

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
