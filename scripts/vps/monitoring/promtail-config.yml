server:
  http_listen_address: 127.0.0.1
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push

scrape_configs:
  - job_name: scraper-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: scraper
          __path__: /var/lib/hercule/streamlit_scraper/output/*/scrape.log
    pipeline_stages:
      - regex:
          source: filename
          expression: ".*/streamlit_scraper/output/(?P<preset>[^/]+)/scrape\\.log$"
      - labels:
          preset:

  - job_name: systemd-scrapers
    journal:
      json: false
      max_age: 12h
      labels:
        job: systemd-scraper
      path: /var/log/journal
    relabel_configs:
      - source_labels: ["__journal__systemd_unit"]
        regex: "hercule-scraper.*\\.service"
        action: keep
      - source_labels: ["__journal__systemd_unit"]
        target_label: unit
